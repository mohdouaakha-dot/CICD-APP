name: "Terraform & App Deployment Pipeline"

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: "Provision & Deploy"
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      # 3. Log into Azure
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 4. Initialize and apply Terraform
      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      # 5. Extract Web App Name from Terraform output
      - name: Get Web App Name
        id: get_app_name
        run: |
          WEBAPP_NAME=$(terraform output -raw webapp_name)
          echo "WEBAPP_NAME=$WEBAPP_NAME" >> $GITHUB_ENV

      # 6. Deploy index.html to Azure App Service
      - name: Deploy Code to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: '.'